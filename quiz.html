<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>这段关系，正在滋养你，还是消耗你？</title>
<style>
:root {
  --bg: #faf8f5;
  --card: #ffffff;
  --primary: #6b5b73;
  --primary-light: #a89bb0;
  --accent: #d4a574;
  --accent-light: #f0dfc8;
  --text: #3a3040;
  --text-secondary: #7a7080;
  --border: #e8e0ec;
  --danger: #c47a7a;
  --success: #7aaa8a;
  --radius: 16px;
  --shadow: 0 2px 16px rgba(90,70,100,0.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  min-height: 100vh;
}
.screen { display:none; min-height:100vh; }
.screen.active { display:flex; flex-direction:column; align-items:center; }

/* ---- Intro ---- */
#intro {
  justify-content: center;
  padding: 2rem;
  text-align: center;
}
#intro .logo {
  font-size: 3rem;
  margin-bottom: 1rem;
}
#intro h1 {
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: .5rem;
  max-width: 360px;
}
#intro .subtitle {
  font-size: .95rem;
  color: var(--text-secondary);
  margin-bottom: 2rem;
  max-width: 340px;
}
#intro .disclaimer {
  font-size: .78rem;
  color: var(--text-secondary);
  max-width: 340px;
  margin-bottom: 2rem;
  line-height: 1.6;
  background: var(--accent-light);
  padding: .8rem 1rem;
  border-radius: var(--radius);
  text-align: left;
}

/* ---- Stage Select ---- */
.stage-select {
  display: flex;
  gap: 1rem;
  margin-bottom: 1.5rem;
}
.stage-card {
  flex: 1;
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem 1rem;
  cursor: pointer;
  transition: all .2s;
  text-align: center;
  max-width: 170px;
}
.stage-card:hover { border-color: var(--primary-light); }
.stage-card:focus-visible, .q-option:focus-visible, .q-na:focus-visible, .btn:focus-visible {
  outline: 3px solid rgba(107, 91, 115, .28);
  outline-offset: 2px;
}
.stage-card.selected { border-color: var(--accent); background: var(--accent-light); }
.stage-card .icon { font-size: 2rem; margin-bottom: .5rem; }
.stage-card .label { font-weight: 600; font-size: .95rem; }
.stage-card .desc { font-size: .8rem; color: var(--text-secondary); margin-top: .3rem; }

/* ---- Buttons ---- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: .75rem 2rem;
  border: none;
  border-radius: 99px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
}
.btn-primary {
  background: var(--primary);
  color: #fff;
}
.btn-primary:hover { background: #5a4a62; }
.btn-primary:disabled { background: var(--border); color: var(--text-secondary); cursor: default; }
.btn-outline {
  background: transparent;
  color: var(--primary);
  border: 1.5px solid var(--border);
}
.btn-outline:hover { border-color: var(--primary); }

/* ---- Quiz ---- */
#quiz { padding: 0; }
.progress-bar-wrap {
  width: 100%;
  background: var(--border);
  height: 4px;
  position: sticky;
  top: 0;
  z-index: 10;
}
.progress-bar {
  height: 100%;
  background: var(--accent);
  transition: width .3s ease;
}
.question-area {
  width: 100%;
  max-width: 560px;
  padding: 2rem 1.5rem;
  flex: 1;
  display: flex;
  flex-direction: column;
}
.q-number {
  font-size: .8rem;
  color: var(--primary-light);
  margin-bottom: .3rem;
}
.q-stem {
  font-size: 1.1rem;
  font-weight: 600;
  margin-bottom: 1.2rem;
  line-height: 1.6;
}
.q-options { display: flex; flex-direction: column; gap: .7rem; }
.q-option {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: .9rem 1.1rem;
  cursor: pointer;
  transition: all .2s;
  font-size: .95rem;
  line-height: 1.6;
  position: relative;
}
.q-option:hover { border-color: var(--primary-light); background: #faf5fc; }
.q-option.selected {
  border-color: var(--accent);
  background: var(--accent-light);
}
.q-option.selected::before {
  content: '';
  position: absolute;
  left: .6rem;
  top: 50%;
  transform: translateY(-50%);
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
}
.q-option .opt-letter {
  display: inline-block;
  width: 1.4rem;
  height: 1.4rem;
  line-height: 1.4rem;
  text-align: center;
  border-radius: 50%;
  background: var(--border);
  color: var(--text-secondary);
  font-size: .75rem;
  font-weight: 600;
  margin-right: .5rem;
  flex-shrink: 0;
}
.q-option.selected .opt-letter {
  background: var(--accent);
  color: #fff;
}
.q-na {
  margin-top: .8rem;
  min-height: 44px;
  padding: .6rem .25rem;
  font-size: .85rem;
  color: var(--text-secondary);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: .3rem;
  align-self: flex-start;
}
.q-na:hover { color: var(--primary); }
.q-na.active { color: var(--accent); }
.nav-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: auto;
  padding-top: 1.5rem;
}
.nav-row .counter {
  font-size: .85rem;
  color: var(--text-secondary);
}

/* ---- Results ---- */
#results { padding: 2rem 1.5rem; }
.results-wrap {
  max-width: 560px;
  width: 100%;
}
.result-header {
  text-align: left;
  margin-bottom: 1rem;
  padding: 1.7rem;
  border-radius: 22px;
  background: linear-gradient(145deg, #fff 0%, #f5ecdf 100%);
  box-shadow: var(--shadow);
  border: 1px solid rgba(212, 165, 116, .28);
}
.result-header h2 {
  font-size: .78rem;
  letter-spacing: .12em;
  color: var(--text-secondary);
  margin-bottom: .65rem;
}
.result-header .result-type {
  font-size: 1.65rem;
  line-height: 1.35;
  font-weight: 750;
  color: var(--primary);
  margin-bottom: .75rem;
}
.result-lead {
  font-size: 1rem;
  line-height: 1.8;
  color: var(--text);
}
.result-kicker {
  display: inline-block;
  margin-top: .85rem;
  padding: .3rem .7rem;
  border-radius: 99px;
  background: rgba(255,255,255,.72);
  color: var(--primary);
  font-size: .78rem;
  font-weight: 600;
}
.story-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: .75rem;
}
.story-panel {
  background: var(--bg);
  border-radius: 12px;
  padding: 1rem;
}
.story-panel .story-label {
  font-size: .76rem;
  color: var(--text-secondary);
  margin-bottom: .3rem;
}
.story-panel strong {
  display: block;
  color: var(--primary);
  font-size: .96rem;
  margin-bottom: .35rem;
}
.story-panel p { color: var(--text-secondary); font-size: .86rem; }
.evidence-list {
  display: flex;
  flex-wrap: wrap;
  gap: .5rem;
  margin-top: .8rem;
}
.evidence-chip {
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: .32rem .7rem;
  font-size: .78rem;
  color: var(--text-secondary);
  background: #fff;
}
.result-boundary {
  border-top: 1px solid var(--border);
  margin-top: .9rem;
  padding-top: .8rem;
  color: var(--text-secondary);
  font-size: .82rem;
}

.result-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 1.5rem;
  margin-bottom: 1rem;
}
.result-card h3 {
  font-size: 1rem;
  color: var(--primary);
  margin-bottom: .6rem;
  display: flex;
  align-items: center;
  gap: .4rem;
}
.result-card p, .result-card li {
  font-size: .92rem;
  line-height: 1.7;
}
.result-card ul {
  padding-left: 1.2rem;
  margin: .3rem 0;
}

/* dimension bars */
.dim-row {
  display: flex;
  align-items: center;
  margin-bottom: .6rem;
  font-size: .88rem;
}
.dim-label {
  width: 100px;
  flex-shrink: 0;
  color: var(--text-secondary);
}
.dim-bar-wrap {
  flex: 1;
  height: 10px;
  background: var(--border);
  border-radius: 5px;
  overflow: hidden;
  margin: 0 .6rem;
}
.dim-bar {
  height: 100%;
  border-radius: 5px;
  transition: width .6s ease;
}
.dim-val {
  width: 36px;
  text-align: right;
  font-weight: 600;
  color: var(--primary);
}

/* source radar placeholder */
.source-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: .5rem;
  margin-top: .5rem;
}
.source-item {
  background: var(--bg);
  border-radius: 10px;
  padding: .7rem .8rem;
  text-align: center;
}
.source-item.primary-source {
  background: var(--accent-light);
  border: 1.5px solid var(--accent);
}
.source-item .s-label { font-size: .82rem; color: var(--text-secondary); }
.source-item .s-val { font-size: 1.1rem; font-weight: 700; color: var(--primary); }
.source-item .s-tag {
  font-size: .7rem;
  background: var(--accent);
  color: #fff;
  border-radius: 99px;
  padding: .1rem .5rem;
  margin-left: .3rem;
}

.safety-card {
  background: #fdf0f0;
  border: 1px solid #f0d0d0;
  border-radius: var(--radius);
  padding: 1rem 1.2rem;
  margin-top: 1rem;
}
.safety-card h3 { color: var(--danger); font-size: .95rem; }
.safety-card p { font-size: .88rem; color: #8a5050; }

.disclaimer-result {
  font-size: .78rem;
  color: var(--text-secondary);
  text-align: center;
  margin-top: 1.5rem;
  line-height: 1.6;
}

.action-list li { margin-bottom: .3rem; }
.signal-list li { margin-bottom: .2rem; color: var(--text-secondary); font-size: .9rem; }

/* ---- Animations ---- */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
.fade-up { animation: fadeUp .4s ease both; }

/* ---- Responsive ---- */
@media (max-width: 480px) {
  #intro h1 { font-size: 1.3rem; }
  .stage-card { padding: 1rem .6rem; }
  .q-stem { font-size: 1rem; }
  .source-grid, .story-grid { grid-template-columns: 1fr; }
  #results { padding: 1rem; }
  .result-header { padding: 1.35rem; }
  .result-header .result-type { font-size: 1.4rem; }
  .dim-row { align-items: flex-start; }
  .dim-label { width: 82px; }
}
</style>

<script>
// =============================================
// DATA & SCORING ENGINE (mirrors stage_a_scoring.py)
// =============================================
let QUIZ_DATA = null;
const RELATIONSHIP_KEYS = ["reciprocity","stability","repair","selfPreservation"];
const SUSTAINABILITY_KEYS = ["stability","repair","selfPreservation"];
const SOURCE_KEYS = ["memory","potential","intermittent","validation","loss"];

function loadQuizData(json) {
  QUIZ_DATA = json;
}

function _round2(v) { return Math.round((v + 1e-12) * 100) / 100; }

function _normalize(raw, mn, mx) {
  if (mx === mn) return 50;
  return _round2(100 * (raw - mn) / (mx - mn));
}

function scoreAnswers(answers, stage) {
  const rules = QUIZ_DATA.rules;
  const questions = QUIZ_DATA.questions.filter(q => q.scene === "all" || q.scene === stage);
  const applicableIds = new Set(questions.map(q => q.id));

  // normalize answers
  const norm = {};
  for (const [qid, val] of Object.entries(answers)) {
    if (!applicableIds.has(qid)) continue;
    if (val === null || val === undefined) { norm[qid] = "NA"; continue; }
    let v = String(val).toUpperCase();
    if (!["A","B","C","D","NA"].includes(v)) v = "NA";
    norm[qid] = v;
  }

  const relRaw = {}, relMin = {}, relMax = {};
  RELATIONSHIP_KEYS.forEach(k => { relRaw[k]=0; relMin[k]=0; relMax[k]=0; });
  const srcRaw = {}, srcMax = {};
  SOURCE_KEYS.forEach(k => { srcRaw[k]=0; srcMax[k]=0; });

  let answered = 0, sourceAnswered = 0, relAnswered = 0, strong = 0;
  const relApplicable = questions.filter(q => q.relationshipApplicability.includes(stage)).length;
  const sourceApplicable = questions.filter(q => q.sourceApplicable).length;
  let unfinishedWeight = 0;
  const outAnswers = {};

  for (const q of questions) {
    const qid = q.id;
    const answer = norm[qid] || "NA";
    outAnswers[qid] = answer;
    if (answer === "NA") continue;

    answered++;
    if (q.sourceApplicable) sourceAnswered++;
    const option = q.options.find(o => o.id === answer);
    const weight = q.recent ? rules.recentQuestionWeight : 1.0;

    if (q.sourceApplicable) {
      for (const k of SOURCE_KEYS) {
        srcRaw[k] += option.s[k] * weight;
        const maxOpt = Math.max(...q.options.map(o => o.s[k]));
        srcMax[k] += maxOpt * weight;
      }
      if ((option.tags || []).includes("unfinished")) unfinishedWeight += weight;
    }

    if (q.relationshipApplicability.includes(stage)) {
      relAnswered++;
      const hasStrong = RELATIONSHIP_KEYS.some(k => option.r[k] <= -2);
      if (hasStrong) strong++;
      for (const k of RELATIONSHIP_KEYS) {
        relRaw[k] += option.r[k] * weight;
        relMin[k] += Math.min(...q.options.map(o => o.r[k])) * weight;
        relMax[k] += Math.max(...q.options.map(o => o.r[k])) * weight;
      }
    }
  }

  const totalCov = questions.length ? answered / questions.length : 0;
  const srcCov = sourceApplicable ? sourceAnswered / sourceApplicable : 0;
  const sceneCov = relApplicable ? relAnswered / relApplicable : 0;
  const cov = rules.coverage;

  const srcComputable = totalCov >= cov.totalAnsweredRatioMin && srcCov >= cov.sourceAnsweredRatioMin;
  const relComputable = relAnswered >= cov.relationshipMinApplicableQuestions && sceneCov >= cov.relationshipApplicableRatioMin;

  const relationship = relComputable
    ? RELATIONSHIP_KEYS.reduce((o,k) => { o[k] = _normalize(relRaw[k], relMin[k], relMax[k]); return o; }, {})
    : null;

  const sustainability = relationship
    ? _round2(SUSTAINABILITY_KEYS.reduce((s,k) => s + relationship[k], 0) / 3)
    : null;

  const sources = srcComputable
    ? SOURCE_KEYS.reduce((o,k) => { o[k] = srcMax[k] === 0 ? 0 : _round2(100 * srcRaw[k] / srcMax[k]); return o; }, {})
    : null;

  // Growth gate
  let growth = false, growthReason = null;
  const g = rules.growthGate;
  if (!g.applicableStages.includes(stage)) {
    growthReason = g.endedNotApplicableReason;
  } else if (relationship) {
    growth = relationship.reciprocity >= g.reciprocityMin
          && relationship.stability >= g.stabilityMin
          && relationship.repair >= g.repairMin
          && relationship.selfPreservation >= g.selfPreservationMin
          && sustainability >= g.sustainabilityMin
          && strong <= g.maxStrongRiskAnswers;
  }

  // Source classification
  const srcRule = rules.source;
  let primary = [], secondary = [], margin = 0, srcStatus = "information_insufficient", reportId = "insufficient_answers";
  if (sources) {
    const order = srcRule.fixedOrder;
    const ranked = [...SOURCE_KEYS].sort((a,b) => sources[b] - sources[a] || order.indexOf(a) - order.indexOf(b));
    const top = sources[ranked[0]];
    margin = top - sources[ranked[1]];
    const near = ranked.filter(k => top - sources[k] <= srcRule.tieGap);

    if (top < srcRule.prominentMin) {
      // fallbackRule: 取最高分来源为主结果；仅最高分为0时输出 insufficient_answers
      if (top === 0) {
        srcStatus = "information_insufficient"; reportId = "insufficient_answers";
      } else {
        srcStatus = "fallback"; primary = [ranked[0]];
        reportId = QUIZ_DATA.dimensions.sources[primary[0]].resultId;
      }
    } else if (near.length >= 3) {
      srcStatus = "multiple"; primary = near.slice(0, srcRule.maxPrimarySources); reportId = "mixed";
    } else if (near.length === 2) {
      srcStatus = "tie"; primary = near; reportId = "mixed";
    } else {
      srcStatus = "primary"; primary = [ranked[0]];
      reportId = QUIZ_DATA.dimensions.sources[primary[0]].resultId;
      secondary = ranked.slice(1).filter(k =>
        sources[k] >= srcRule.prominentMin && top - sources[k] <= srcRule.secondaryGap
      ).slice(0,1);
    }
  }

  // Confidence
  let thresholds = [];
  if (sources) {
    thresholds.push(
      Math.abs(Math.max(...Object.values(sources)) - srcRule.prominentMin),
      Math.abs(margin - srcRule.tieGap),
      Math.abs(margin - srcRule.secondaryGap)
    );
  }
  if (relationship) {
    for (const k of RELATIONSHIP_KEYS) thresholds.push(Math.abs(relationship[k] - g[`${k}Min`]));
    thresholds.push(Math.abs(sustainability - g.sustainabilityMin));
  }
  const thresholdDist = thresholds.length ? Math.min(...thresholds) : 0;

  let confLevel = "insufficient";
  if (srcComputable) {
    const h = rules.confidence.high, m = rules.confidence.medium;
    if (totalCov >= h.totalCoverageMin && srcCov >= h.sourceCoverageMin && sceneCov >= h.sceneCoverageMin && margin >= h.primaryMarginMin && thresholdDist >= h.thresholdDistanceMin) {
      confLevel = "high";
    } else if (totalCov >= m.totalCoverageMin && srcCov >= m.sourceCoverageMin && sceneCov >= m.sceneCoverageMin && margin >= m.primaryMarginMin && thresholdDist >= m.thresholdDistanceMin) {
      confLevel = "medium";
    } else {
      confLevel = "low";
    }
  }

  const unfinished = srcComputable ? unfinishedWeight >= srcRule.unfinishedEvidenceWeightMin : false;

  return {
    stage, relationship, sustainability, sources, growth, growthReason,
    srcStatus, primary, secondary, reportId, unfinished, unfinishedWeight,
    sourceTop: sources ? Math.max(...Object.values(sources)) : null,
    sourceMargin: sources ? _round2(margin) : null,
    confidence: confLevel, strongRiskCount: strong,
    totalCov: _round2(totalCov), srcCov: _round2(srcCov), sceneCov: _round2(sceneCov),
    answeredCount: answered, applicableCount: questions.length,
    answers: outAnswers
  };
}

// =============================================
// UI LOGIC
// =============================================
loadQuizData(QUIZ_DATA_INLINE);

let selectedStage = null;
let currentQ = 0;
let userAnswers = {};
let quizQuestions = [];

// ---- Intro ----
function stageQuestionCount(stage) {
  return QUIZ_DATA.questions.filter(q => q.scene === 'all' || q.scene === stage).length;
}

function selectStage(card) {
  document.querySelectorAll('.stage-card').forEach(c => {
    const selected = c === card;
    c.classList.toggle('selected', selected);
    c.setAttribute('aria-pressed', String(selected));
  });
  selectedStage = card.dataset.stage;
  document.getElementById('startBtn').disabled = false;
  document.getElementById('quizMeta').textContent = `本阶段共 ${stageQuestionCount(selectedStage)} 题 · 约 5-8 分钟`;
}

document.querySelectorAll('.stage-card').forEach(card => {
  if (card.classList.contains('selected')) selectedStage = card.dataset.stage;
  card.addEventListener('click', () => selectStage(card));
  card.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      selectStage(card);
    }
  });
});
if (selectedStage) {
  document.getElementById('startBtn').disabled = false;
  document.getElementById('quizMeta').textContent = `本阶段共 ${stageQuestionCount(selectedStage)} 题 · 约 5-8 分钟`;
}

document.getElementById('startBtn').addEventListener('click', () => {
  if (!selectedStage) return;
  quizQuestions = QUIZ_DATA.questions.filter(q => q.scene === 'all' || q.scene === selectedStage);
  currentQ = 0;
  userAnswers = {};
  quizQuestions.forEach(q => userAnswers[q.id] = null);
  showScreen('quiz');
  renderQuestion();
});

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

// ---- Quiz ----
function renderQuestion() {
  const q = quizQuestions[currentQ];
  const area = document.getElementById('questionArea');
  const pct = ((currentQ + 1) / quizQuestions.length * 100);
  document.getElementById('progressBar').style.width = pct + '%';

  let optHtml = '';
  q.options.forEach(o => {
    const sel = userAnswers[q.id] === o.id ? ' selected' : '';
    optHtml += `<div class="q-option${sel}" data-qid="${q.id}" data-oid="${o.id}" role="button" tabindex="0" aria-pressed="${userAnswers[q.id] === o.id}">
      <span class="opt-letter">${o.id}</span>${o.text}
    </div>`;
  });

  const naActive = userAnswers[q.id] === 'NA' ? ' active' : '';

  area.innerHTML = `
    <div class="fade-up">
      <div class="q-number">第 ${currentQ + 1} / ${quizQuestions.length} 题</div>
      <div class="q-stem">${q.stem}</div>
      <div class="q-options">${optHtml}</div>
      <div class="q-na${naActive}" data-qid="${q.id}" role="button" tabindex="0" aria-pressed="${userAnswers[q.id] === 'NA'}">不确定 / 不适用 / 不想回答</div>
    </div>
    <div class="nav-row">
      <button class="btn btn-outline" id="prevBtn" ${currentQ === 0 ? 'disabled' : ''}>上一题</button>
      <span class="counter">${Object.values(userAnswers).filter(v => v !== null).length} / ${quizQuestions.length} 已答</span>
      <button class="btn btn-primary" id="nextBtn" ${userAnswers[q.id] === null ? 'disabled' : ''}>${currentQ === quizQuestions.length - 1 ? '查看结果' : '下一题'}</button>
    </div>
  `;

  // option click
  area.querySelectorAll('.q-option').forEach(el => {
    const chooseOption = () => {
      userAnswers[el.dataset.qid] = el.dataset.oid;
      renderQuestion();
    };
    el.addEventListener('click', chooseOption);
    el.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        chooseOption();
      }
    });
  });

  // NA click
  const naOption = area.querySelector('.q-na');
  const chooseNa = () => {
    userAnswers[naOption.dataset.qid] = 'NA';
    renderQuestion();
  };
  naOption.addEventListener('click', chooseNa);
  naOption.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      chooseNa();
    }
  });

  // nav
  document.getElementById('prevBtn').addEventListener('click', () => {
    if (currentQ > 0) { currentQ--; renderQuestion(); }
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    if (currentQ < quizQuestions.length - 1) {
      currentQ++;
      renderQuestion();
    } else {
      showResults();
    }
  });
}

// ---- Results ----
function relationshipStory(result, dimLabels) {
  if (!result.relationship) {
    return {
      title: '目前还不足以判断关系状态',
      summary: '有效答案较少，这次先不对关系作整体判断。',
      detail: '不需要为了得到结论而勉强补答。'
    };
  }

  const values = RELATIONSHIP_KEYS.map(k => result.relationship[k]);
  const average = values.reduce((sum, value) => sum + value, 0) / values.length;
  const lowestKey = [...RELATIONSHIP_KEYS].sort((a, b) => result.relationship[a] - result.relationship[b])[0];
  const strongestKey = [...RELATIONSHIP_KEYS].sort((a, b) => result.relationship[b] - result.relationship[a])[0];
  const historyPrefix = result.stage === 'ended' ? '回看这段关系，' : '';

  if (result.growth) {
    return {
      title: '现实相处中有较多双向支持',
      summary: `${historyPrefix}双方大多愿意用实际行动回应彼此；平时的相处让你心里有底，遇到问题后也能重新沟通。同时，你不需要总是压下自己的感受或放弃原来的生活。`,
      detail: `${dimLabels[strongestKey]}是目前表现更好的一面；接下来可以继续留意${dimLabels[lowestKey]}。`
    };
  }
  if (average >= 62) {
    return {
      title: result.stage === 'ended' ? '这段经历里有不少现实支持' : '关系有现实支撑，也有一处需要继续观察',
      summary: `${historyPrefix}这段相处大部分时候能给你支持，但还有一个重要部分没有那么稳。`,
      detail: `目前更值得留意的是${dimLabels[lowestKey]}，看看它是否正在影响你的安心感和日常状态。`
    };
  }
  if (average >= 50) {
    return {
      title: result.stage === 'ended' ? '这段经历既有支持，也留下了消耗' : '这段关系里，支持与消耗同时存在',
      summary: `${historyPrefix}有些相处让你感到被支持，也有些时候需要你花更多力气才能维持。`,
      detail: `最需要回到现实中观察的是${dimLabels[lowestKey]}：它带来的舒服和压力，哪一种更常出现。`
    };
  }
  return {
    title: result.stage === 'ended' ? '这段经历带来的压力更明显' : '这段关系目前更需要照顾你的消耗感',
    summary: `${historyPrefix}你得到的回应和安心感相对有限；出现问题时，双方也未必能一起处理，或者你常常需要压下自己的感受来维持关系。`,
    detail: `其中最需要留意的是${dimLabels[lowestKey]}，以及它是否持续影响你的情绪、生活和选择。`
  };
}

function sourceStory(result, reports, srcLabels) {
  const presentationReportId = result.srcStatus === 'fallback' ? 'sources_not_prominent' : result.reportId;
  const report = reports[presentationReportId] || reports.insufficient_answers;
  const primaryNames = result.primary.map(k => srcLabels[k]);
  const closeNames = result.sources
    ? [...SOURCE_KEYS]
        .sort((a, b) => result.sources[b] - result.sources[a])
        .filter(k => result.sourceTop - result.sources[k] <= QUIZ_DATA.rules.source.tieGap)
        .map(k => srcLabels[k])
    : [];

  if (result.srcStatus === 'information_insufficient') {
    return { title: '目前还无法判断什么最影响你的投入', summary: report.core, report };
  }
  if (result.srcStatus === 'fallback') {
    return {
      title: '没有某一种感受明显左右你的判断',
      summary: '过去的美好、对未来变好的期待、偶尔出现的热情、想确认自己被重视，以及害怕失去关系，都没有明显左右你的判断。关系是否适合你，更值得根据双方现实中怎样相处来判断。',
      report
    };
  }
  if (result.srcStatus === 'tie' || result.srcStatus === 'multiple') {
    return {
      title: `${closeNames.slice(0, 2).join('与')}共同影响你的判断`,
      summary: `这组完整答案同时指向${closeNames.join('、')}，不适合压缩成一个标签。它们可能在不同情境里轮流变得重要。`,
      report
    };
  }

  const boundary = result.sourceMargin < QUIZ_DATA.rules.confidence.medium.primaryMarginMin;
  return {
    title: `${primaryNames.join('、')}，更容易影响你现在的判断`,
    summary: `${report.core}${boundary ? ' 不过它与下一项比较接近，更适合作为观察方向，而不是固定标签。' : ''}${result.unfinished ? ' 答案中也出现了对未完成部分的在意。' : ''}`,
    report
  };
}

function mainResultStory(result, relationship, source) {
  if (result.srcStatus === 'information_insufficient' && !result.relationship) {
    return {
      title: '这次信息还不足，先不用勉强给关系下结论',
      lead: '较多题目与你的情况不重合，或你选择了“不确定 / 不适用”。这不是答错，只是本次答案还不足以支持可靠解释。'
    };
  }
  if (result.growth && result.srcStatus === 'fallback') {
    return {
      title: '你更像是在根据现实相处，判断这段关系',
      lead: '这段关系目前给了你较多现实支持。过去的美好、对未来的期待、偶尔的高光、想被重视或害怕失去，都没有明显左右你的判断；你更像是在根据双方当下怎样相处来感受这段关系。'
    };
  }
  if (result.growth) {
    return {
      title: '这段关系有现实支撑，也有一种感受在牵动你',
      lead: `${relationship.summary}与此同时，${source.title}。这两件事可以同时成立。`
    };
  }
  if (result.srcStatus === 'fallback') {
    return {
      title: relationship.title,
      lead: `${relationship.summary}没有某一种特定感受明显左右你的判断，所以更值得看现实中的相处，是否持续符合你的需要。`
    };
  }
  return {
    title: relationship.title,
    lead: `${relationship.summary}同时，${source.title}；它解释的是你如何理解或留恋这段关系，并不替代对现实相处的判断。`
  };
}

function showResults() {
  const result = scoreAnswers(userAnswers, selectedStage);
  const reports = QUIZ_DATA.reports;
  const dimLabels = Object.fromEntries(
    Object.entries(QUIZ_DATA.dimensions.relationship).map(([key, value]) => [key, value.label])
  );
  const srcLabels = Object.fromEntries(
    Object.entries(QUIZ_DATA.dimensions.sources).map(([key, value]) => [key, value.label])
  );
  const relationship = relationshipStory(result, dimLabels);
  const source = sourceStory(result, reports, srcLabels);
  const main = mainResultStory(result, relationship, source);
  const mainReport = source.report;
  const wrap = document.getElementById('resultsWrap');

  let html = `<div class="result-header fade-up">
    <h2>你的关系观察</h2>
    <div class="result-type">${main.title}</div>
    <p class="result-lead">${main.lead}</p>
    <span class="result-kicker">已回答 ${result.answeredCount}/${result.applicableCount} 道当前阶段适用题</span>
  </div>`;

  html += `<div class="result-card fade-up">
    <h3>这份结果的两个角度</h3>
    <div class="story-grid">
      <div class="story-panel">
        <div class="story-label">现实相处</div>
        <strong>${relationship.title}</strong>
        <p>${relationship.detail}</p>
      </div>
      <div class="story-panel">
        <div class="story-label">什么在影响你的判断和投入</div>
        <strong>${source.title}</strong>
        <p>${source.summary}</p>
      </div>
    </div>
    <p class="result-boundary">前一部分看你们现实中怎样相处；后一部分看哪些感受更容易影响你对关系的判断和投入。</p>
  </div>`;

  if (result.relationship) {
    const colors = { reciprocity:'#7aaa8a', stability:'#6b9bc0', repair:'#d4a574', selfPreservation:'#a89bb0' };
    const gate = QUIZ_DATA.rules.growthGate;
    const levelFor = (key, value) => value >= gate[`${key}Min`] ? '积极迹象较多' : value >= 50 ? '有一些积极迹象' : '较需要留意';
    html += `<div class="result-card fade-up"><h3>关系如何运行</h3><p style="color:var(--text-secondary);font-size:.86rem;margin-bottom:.8rem">不展示容易误解的裸分，只呈现本次答案中的相对状态。</p>`;
    for (const k of RELATIONSHIP_KEYS) {
      const v = result.relationship[k];
      html += `<div class="dim-row">
        <span class="dim-label">${dimLabels[k]}</span>
        <div class="dim-bar-wrap"><div class="dim-bar" style="width:${v}%;background:${colors[k]}"></div></div>
        <span class="dim-val" style="width:6.8rem">${levelFor(k, v)}</span>
      </div>`;
    }
    const sustainabilityLevel = result.sustainability >= gate.sustainabilityMin ? '积极迹象较多' : result.sustainability >= 50 ? '有一些积极迹象' : '较需要留意';
    html += `<div class="dim-row" style="margin-top:.5rem;padding-top:.5rem;border-top:1px dashed var(--border)">
      <span class="dim-label" style="font-weight:600;color:var(--text)">这样的相处能不能长期让你舒服</span>
      <div class="dim-bar-wrap"><div class="dim-bar" style="width:${result.sustainability}%;background:var(--primary)"></div></div>
      <span class="dim-val" style="width:6.8rem">${sustainabilityLevel}</span>
    </div>
    <div class="evidence-list">
      ${RELATIONSHIP_KEYS.map(k => `<span class="evidence-chip">${dimLabels[k]}：${levelFor(k, result.relationship[k])}</span>`).join('')}
    </div></div>`;
  }

  html += `<div class="result-card fade-up">
    <h3>接下来最值得看</h3>
    <ul class="signal-list">${mainReport.signals.slice(0, 2).map(item => `<li>${item}</li>`).join('')}</ul>
    <p style="margin-top:.8rem"><strong>别忽略：</strong>${mainReport.risks}</p>
  </div>`;

  html += `<div class="result-card fade-up"><h3>可以马上做的两件小事</h3><ul class="action-list">
    ${mainReport.actions.slice(0, 2).map(item => `<li>${item}</li>`).join('')}
  </ul><p style="font-size:.82rem;color:var(--text-secondary);margin-top:.6rem">不必急着作决定，按你舒服的节奏观察即可。</p></div>`;

  html += `<div class="result-card fade-up" style="text-align:center;background:var(--accent-light)">
    <p style="font-size:1.08rem;font-weight:600;color:var(--primary)">“${mainReport.share}”</p>
  </div>`;

  if (result.stage === 'ended') {
    html += `<div class="result-card fade-up"><h3>关于已经结束的关系</h3><p>这里呈现的是对过往相处的回看，不判断你们现在是否处于“双向生长”，也不暗示是否应该复合。</p></div>`;
  }

  html += `<div class="safety-card fade-up"><h3>安全提示</h3><p>${mainReport.safety}</p></div>`;
  html += `<div class="disclaimer-result">
    本测试为自我觉察与娱乐内容，不替你决定分手或复合。结果只反映当前作答，也不能覆盖题目之外的处境。<br>
    页面层级不是概率、百分位或心理诊断；“不确定 / 不适用”不计分。
  </div>`;

  html += `<div style="text-align:center;margin-top:2rem;display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap">
    <button class="btn btn-outline" onclick="exportAnswers()">复制本次答案</button>
    <button class="btn btn-outline" onclick="restart()">重新测试</button>
  </div>`;

  wrap.innerHTML = html;
  showScreen('results');
  setTimeout(() => {
    document.querySelectorAll('.dim-bar').forEach(bar => {
      const width = bar.style.width;
      bar.style.width = '0%';
      requestAnimationFrame(() => { bar.style.width = width; });
    });
  }, 100);
}

async function exportAnswers() {
  const payload = JSON.stringify({ stage: selectedStage, answers: userAnswers });
  try {
    await navigator.clipboard.writeText(payload);
    alert('本次答案已复制。刷新后点击“导入上次答案”，粘贴即可。');
  } catch (_) {
    prompt('请复制下面的答案数据：', payload);
  }
}

function importAnswers() {
  const raw = prompt('请粘贴之前复制的答案数据：');
  if (!raw) return;
  try {
    const payload = JSON.parse(raw);
    if (!['ongoing', 'ended'].includes(payload.stage) || !payload.answers || typeof payload.answers !== 'object') {
      throw new Error('invalid payload');
    }
    const applicable = QUIZ_DATA.questions.filter(q => q.scene === 'all' || q.scene === payload.stage);
    const allowedIds = new Set(applicable.map(q => q.id));
    const imported = {};
    for (const [qid, value] of Object.entries(payload.answers)) {
      const answer = String(value).toUpperCase();
      if (allowedIds.has(qid) && ['A', 'B', 'C', 'D', 'NA'].includes(answer)) imported[qid] = answer;
    }
    if (!Object.keys(imported).length) throw new Error('no answers');
    selectedStage = payload.stage;
    userAnswers = imported;
    showResults();
  } catch (_) {
    alert('无法识别这份答案。请确认复制了完整内容后再试。');
  }
}

function restart() {
  selectedStage = null;
  currentQ = 0;
  userAnswers = {};
  document.querySelectorAll('.stage-card').forEach(c => {
    c.classList.remove('selected');
    c.setAttribute('aria-pressed', 'false');
  });
  document.getElementById('startBtn').disabled = true;
  document.getElementById('quizMeta').textContent = '请选择关系阶段后查看题数';
  showScreen('intro');
}
